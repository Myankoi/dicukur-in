services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: barber_booking
    ports:
      - "3307:3306" # Port 3307 di laptop -> 3306 di container
    volumes:
      - db_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
    restart: unless-stopped

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - mariadb
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=barber_booking
      - DB_USER=root
      - DB_PASSWORD=rootpassword
    depends_on:
      - mariadb
    restart: unless-stopped

volumes:
  db_data: