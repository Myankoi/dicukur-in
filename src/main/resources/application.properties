server.port=${PORT:8080}
logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

# Matikan auto-launch browser di dalam Docker
vaadin.launch-browser=false

# --- Konfigurasi Database (MariaDB) ---
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:dicukurin_db}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate auto table creation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true