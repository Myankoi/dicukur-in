spring:
  application:
    name: dicukur-in

  datasource:
    url: jdbc:mariadb://localhost:3306/barber_booking
    username: root
    password:
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

app:
  upload-dir: uploads