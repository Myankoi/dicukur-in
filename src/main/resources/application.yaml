spring:
  application:
    name: dicukur-in

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:barber_booking}?createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  mustache:
    check-template-location: false

server:
  port: ${PORT:8080}

vaadin:
  launch-browser: false

logging:
  level:
    org.atmosphere: warn

app:
  upload-dir: uploads

midtrans:
  server-key: ${MIDTRANS_SERVER_KEY:}
  production: ${MIDTRANS_PRODUCTION:false}
